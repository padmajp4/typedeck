<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — Typedeck</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: #fff; color: #111113; text-align: center; padding: 24px;
  }
  @media (prefers-color-scheme: dark) { body { background: #0c0c0d; color: #f2f2f3; } }
  .card { max-width: 380px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.5; color: #71717a; margin: 0 0 16px; }
  button {
    border: 1px solid #e6e6e6; background: transparent; color: inherit;
    border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>
      Typedeck needs a connection to load font catalogues. Pages you've
      already opened may still work from cache.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
